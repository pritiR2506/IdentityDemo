apiVersion: apps/v1
kind: Deployment
metadata:
  name: identitydemo-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: identitydemo-api
  template:
    metadata:
      labels:
        app: identitydemo-api
    spec:
      containers:
        - name: api
          image: identitydemo-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: identitydemo-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: identitydemo-api
spec:
  selector:
    app: identitydemo-api
  ports:
    - port: 80
      targetPort: 8080